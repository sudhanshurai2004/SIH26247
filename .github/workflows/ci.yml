name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python contracts and dashboard build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies
        run: make setup

      - name: Verify contracts, API shell, lint, and dashboard
        run: make ci

  godot-headless:
    name: Godot 4 native smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download pinned official Godot 4.5.1 binary
        env:
          GODOT_VERSION: 4.5.1-stable
          GODOT_SHA256: 02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd
        run: |
          set -euo pipefail
          mkdir -p .tools/godot
          curl --fail --location --retry 3 --retry-delay 2 \
            --output .tools/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "${GODOT_SHA256}  .tools/godot/godot.zip" | sha256sum --check --status
          unzip -q .tools/godot/godot.zip -d .tools/godot
          chmod +x .tools/godot/Godot_v${GODOT_VERSION}_linux.x86_64

      - name: Import Godot project
        run: |
          set -euo pipefail
          .tools/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path client --editor --quit --verbose \
            2>&1 | tee godot-import.log

      - name: Load 2D scene, seek seeded playback, and check event outbox
        run: |
          set -euo pipefail
          if ! .tools/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path client \
            --script res://tests/headless_smoke.gd 2>&1 | tee godot-headless.log; then
            tail_text="$(tail -n 50 godot-headless.log | tr '\n' ' ')"
            echo "::error title=Godot smoke output::${tail_text}"
            exit 1
          fi
          grep --fixed-strings "GODOT_SMOKE_OK:" godot-headless.log

      - name: Upload native Godot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-native-logs
          path: |
            godot-import.log
            godot-headless.log
          if-no-files-found: warn

  offline-wheelhouse:
    name: Offline wheelhouse install
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build locked wheelhouse
        run: python scripts/build_wheelhouse.py --wheelhouse wheelhouse

      - name: Install from wheelhouse with no internet/index
        run: python scripts/test_offline_wheelhouse.py --wheelhouse wheelhouse

  windows-launch-smoke:
    name: Windows setup and launcher smoke
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Run locked Windows setup
        shell: pwsh
        run: ./scripts/setup_windows.ps1

      - name: Build local source package
        shell: bash
        run: ./scripts/package_offline.sh

      - name: Launch packaged launch.bat and require dashboard/API HTTP 200
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $PWD "out\SIH26247-offline-trainer"
          Copy-Item -Recurse -Force ".venv" (Join-Path $package ".venv")
          $database = Join-Path $package "data\ci-launch.sqlite3"
          $env:SIH26247_DB_PATH = $database
          $process = Start-Process -FilePath (Join-Path $package "launch.bat") `
            -WorkingDirectory $package -ArgumentList @() -PassThru -WindowStyle Hidden
          try {
            $api = $null
            $dashboard = $null
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $api = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8000/api/health" -TimeoutSec 2
                $dashboard = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8000/" -TimeoutSec 2
                if ($api.StatusCode -eq 200 -and $dashboard.StatusCode -eq 200) { break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if ($null -eq $api -or $api.StatusCode -ne 200) { throw "API health did not return HTTP 200" }
            if ($null -eq $dashboard -or $dashboard.StatusCode -ne 200) { throw "Dashboard did not return HTTP 200" }
            Write-Host "WINDOWS_LAUNCH_SMOKE_OK: API=$($api.StatusCode) dashboard=$($dashboard.StatusCode)"
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
